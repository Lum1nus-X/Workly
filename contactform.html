<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนสมัครงาน — w. Workly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="template_style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="sticky top-4 z-50 max-w-6xl mx-auto px-4 w-full">
        <nav class="bg-white/80 backdrop-blur-md border border-zinc-200/80 rounded-full px-6 py-3 flex items-center justify-between shadow-sm">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-zinc-900">
                <span>w.</span><span> Workly</span>
            </a>
            <ul class="hidden md:flex items-center gap-8 text-sm font-medium text-zinc-600">
                <li><a href="index.html" class="hover:text-zinc-900">ค้นหางาน</a></li>
                <li><a href="category.html" class="hover:text-zinc-900">คอร์สเรียน AI</a></li>
                <li><a href="about.html" class="hover:text-zinc-900">เกี่ยวกับเรา</a></li>
            </ul>
            <a href="contactform.html" class="bg-zinc-900 text-white text-xs font-medium px-5 py-2.5 rounded-full">สมัครสมาชิก</a>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-4 w-full pt-8 pb-16 flex-grow">
        <div class="bg-white rounded-3xl p-8 border border-zinc-200/80 shadow-sm space-y-6">
            <div>
                <h1 class="text-2xl font-bold text-zinc-900">แบบฟอร์มลงทะเบียนสมัครงาน & ประเมินทักษะ</h1>
                <p class="text-xs text-zinc-500 mt-1">กรอกข้อมูลส่วนตัวเพื่อบันทึกประวัติเข้าสู่ระบบ Crework</p>
            </div>

            <form onsubmit="return validateApplicationForm(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-zinc-700 mb-1">ตำแหน่งงานที่สนใจ</label>
                    <input type="text" id="target-job" value="ทั่วไป / ไม่ระบุ" class="w-full px-3.5 py-2.5 bg-zinc-100 text-zinc-800 font-semibold rounded-xl border border-zinc-200 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-zinc-700 mb-1">ชื่อจริง *</label>
                        <input type="text" id="fname" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 outline-none focus:border-zinc-900">
                    </div>
                    <div>
                        <label class="block font-medium text-zinc-700 mb-1">นามสกุล *</label>
                        <input type="text" id="lname" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 outline-none focus:border-zinc-900">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-zinc-700 mb-1">อีเมล *</label>
                        <input type="email" id="email" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 outline-none focus:border-zinc-900">
                    </div>
                    <div>
                        <label class="block font-medium text-zinc-700 mb-1">เบอร์โทรศัพท์ (10 หลัก) *</label>
                        <input type="tel" id="phone" required placeholder="08XXXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 outline-none focus:border-zinc-900">
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-zinc-700 mb-1">ประเมินระดับสมรรถนะ AI (AI Skill Tier) *</label>
                    <select id="aiTier" required class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-300 outline-none focus:border-zinc-900 bg-white">
                        <option value="">-- เลือกระดับสมรรถนะ --</option>
                        <option value="beginner">ระดับเริ่มต้น (Beginner Tier)</option>
                        <option value="pioneer">ระดับผู้บุกเบิก (Pioneer Tier)</option>
                        <option value="innovator">ระดับผู้สร้างสรรค์สิ่งใหม่ (Innovator Tier)</option>
                    </select>
                </div>

                <div class="pt-2">
                    <label class="flex items-start gap-2 text-zinc-500 cursor-pointer">
                        <input type="checkbox" id="pdpa" class="mt-0.5 rounded text-zinc-900">
                        <span>ยินยอมให้จัดเก็บข้อมูลส่วนบุคคลตาม พ.ร.บ. คุ้มครองข้อมูลส่วนบุคคล (PDPA Consent)</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-zinc-900 hover:bg-black text-white font-medium rounded-xl transition-all shadow-md mt-2">
                    ยืนยันการส่งข้อมูลสมัครงาน
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-zinc-200/80 py-6 text-center text-xs text-zinc-400">
        &copy; 2026 w.Workly All rights reserved.
    </footer>

    <script src="form_validation.js"></script>
</body>
</html>
